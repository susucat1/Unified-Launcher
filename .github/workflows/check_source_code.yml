name: Check source code

on:
  push:
    branches: [ "main", "next" ]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
  pull_request:
    branches: [ "main", "next" ]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check_source_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev git curl cmake libssl-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          
      - uses: Swatinem/rust-cache@v2

      - name: Check source code
        run: cargo check --verbose

      - name: Lint code
        run: cargo clippy -- -D warnings
