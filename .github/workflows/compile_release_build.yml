name: Compile release build

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            protobuf-compiler \
            cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Compile release build
        run: cargo build --release

      - name: Package binary
        run: |
          strip target/release/unified-launcher
          cd target/release
          tar -czvf unified-launcher-linux-x86_64.tar.gz unified-launcher

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-launcher-linux-x86_64
          path: target/release/unified-launcher-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/unified-launcher-linux-x86_64.tar.gz
          generate_release_notes: true
