name: Prevent PRs against `main`

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  redirect_to_next:
    if: >
      github.base_ref == 'main' &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Retarget PR to `next` and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --base next
          gh pr comment "$PR_NUMBER" --body "Your PR was set to target \`main\`, but PRs should target \`next\`.

          The base branch of this PR has been automatically changed to \`next\`.
          Please verify that there are no merge conflicts."
