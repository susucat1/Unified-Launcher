name: Prevent PRs against `main`

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  redirect_to_next:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Retarget PR to `next` and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # 1.
          gh pr edit "$PR_URL" --base next

          # 2.
          gh pr comment "$PR_URL" --body "Your PR was set to target \`main\`, PRs should target \`next\`.

          The base branch of this PR has been automatically changed to \`next\`.
          Please verify that there are no merge conflicts."
