[package]
name = "Unified-Launcher"
version = "0.1.0"
description = "Unified Launcher"
authors = []
homepage = "https://github.com/susucat1/Unified-Launcher"
repository = "https://github.com/susucat1/Unified-Launcher"
license = "GPL-3.0-only"
edition = "2024"
build = "build.rs"
publish = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
glib-build-tools = "0.20"

[dependencies]
# UI Framework (Relm4 / GTK4 / Libadwaita)
iced = { version = "0.13", features = ["tokio"] }

# System & Memory Allocation
mimalloc = { version = "0.1", default-features = false }
open = "5.3"
whatadistro = "0.1"

# Data, State & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cached = { version = "0.55", features = ["proc_macro"] }
md-5 = "0.10"
enum-ordinalize = "4.3"

# Error Handling & Logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Localization
fluent-templates = "0.13"
unic-langid = "0.9"

# Workspace sub-crates
Honkai-Impact = { path = "crates/launcher/Honkai", optional = true }
Genshin-Impact = { path = "crates/launcher/Genshin", optional = true }
StarRail = { path = "crates/launcher/StarRail", optional = true }
ZZZ = { path = "crates/launcher/ZZZ", optional = true }

[workspace]
resolver = "2"
members = [
    "crates/launcher/Honkai",
    "crates/launcher/Genshin",
    "crates/launcher/StarRail",
    "crates/launcher/ZZZ",
]
